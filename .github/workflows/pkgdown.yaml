## Thin caller -- the pkgdown build and the gh-pages deploy live in
## PredictiveEcology/actions. The hand-rolled version was already identical to
## the shared one step for step, so nothing is customised here.

name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    uses: PredictiveEcology/actions/.github/workflows/pkgdown.yaml@main
    secrets: inherit
