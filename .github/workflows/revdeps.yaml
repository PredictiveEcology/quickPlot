## Thin caller -- the job harness (checkout, geospatial system libraries, R,
## dependency install) and the revdeps-check action live in
## PredictiveEcology/actions.
##
## Was: pull_request + weekly across a THREE-OS matrix, calling the composite
## action directly. The shared action's own README warns revdep checks are too
## resource intensive for standard runners, and each revdep gets a full
## R CMD check with its dependency closure installed first -- hours of runner
## time per PR, for a signal almost no PR changes. Now dispatch plus the same
## weekly schedule, on the shared single-leg default.
##
## This also drops the stale install-spatial-deps@v0.3 pin; the shared workflow
## uses @main, which is what PR #43 was opened to fix.

name: revdeps

on:
  workflow_dispatch:
  schedule:
    - cron: '23 23 * * 0'

jobs:
  revdeps:
    uses: PredictiveEcology/actions/.github/workflows/revdeps.yaml@main
    secrets: inherit
