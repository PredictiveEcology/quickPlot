## Thin caller -- covr, the codecov upload and the trace-file handling live in
## PredictiveEcology/actions.
##
## Two behaviour changes worth knowing, both improvements:
##   * runs on ubuntu-latest, not macOS-latest (the shared default);
##   * the shared workflow sets NOT_CRAN=true, so skip_on_cran() tests now run
##     under coverage. That raises the measured figure and can surface tests
##     that had never executed in CI. Require hit exactly that on migration.
##
## Triggers were [master, development]; there is no `master` branch here.

name: test-coverage

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

## Never cancel a push/merge coverage run -- covr is slow and merges land close
## together, so cancelling one reads as spurious red. PRs are fair game.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@main
    secrets: inherit
